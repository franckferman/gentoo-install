name: CI

# The jobs below run `make lint` and `make test` and nothing else, on purpose.
# The Makefile's first paragraph promises that everything CI runs is runnable
# locally with the same arguments; the way to keep that true is for CI to call
# the same targets rather than to keep its own copy of the file list. The copy
# had already drifted: it linted gentoo-install.sh and lib/*.sh while the
# Makefile linted steps/, variants/ and tools/ as well, so three quarters of the
# project was passing CI without ever being checked.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No tool is installed here on purpose. The Makefile runs each check
      # natively when the tool is present and in a pinned container when it is
      # not, so leaving the runner bare makes CI execute exactly what a
      # contributor with none of them installed executes.
      #
      # This is not hypothetical tidiness: CI installed shellcheck from apt
      # while the Makefile used koalaman/shellcheck:stable, the two versions
      # disagreed about SC2015, and a push went red on four lines that were
      # green on every developer machine.
      - name: make lint
        run: make lint

  test:
    name: bats
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # Same reasoning, and the version requirement enforces itself:
      # tests/helper.bash calls bats_require_minimum_version, so a bats too old
      # to run the suite says so in one line instead of failing forty tests.
      - name: make test
        run: make test

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: --help, --version, --list-steps
        run: |
          ./gentoo-install.sh --help
          ./gentoo-install.sh --version
          ./gentoo-install.sh --list-steps

      # The claim under test is about stdout, not about the run succeeding. A
      # dry run on a bare runner legitimately ends non-zero — there is no target
      # disk and no root — and with `bash -e` the unguarded assignment aborted
      # the step before the assertion was ever reached. The check had therefore
      # never once run.
      - name: Nothing but --json writes on stdout
        run: |
          out="$(./gentoo-install.sh --dry-run --non-interactive 2>/dev/null || true)"
          test -z "$out" || { echo "unexpected stdout: $out" >&2; exit 1; }

      - name: --json is valid JSON
        run: ./gentoo-install.sh --json | python3 -m json.tool > /dev/null

      - name: An unknown option exits 2
        run: |
          set +e
          ./gentoo-install.sh --no-such-flag
          rc=$?
          set -e
          test "$rc" -eq 2 || { echo "expected exit 2, got ${rc}" >&2; exit 1; }
