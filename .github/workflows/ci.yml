name: CI

# The jobs below run `make lint` and `make test` and nothing else, on purpose.
# The Makefile's first paragraph promises that everything CI runs is runnable
# locally with the same arguments; the way to keep that true is for CI to call
# the same targets rather than to keep its own copy of the file list. The copy
# had already drifted: it linted gentoo-install.sh and lib/*.sh while the
# Makefile linted steps/, variants/ and tools/ as well, so three quarters of the
# project was passing CI without ever being checked.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v3

      # The Makefile falls back to a container when a tool is missing; both are
      # installed above, so this runs them natively and stays fast.
      - name: make lint
        run: make lint

  test:
    name: bats
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      # tests/helper.bash declares the version the suite needs, with
      # bats_require_minimum_version. Reading it from there rather than
      # repeating it means the two cannot disagree, and a runner image that
      # ships something older fails here — saying so — instead of failing in
      # forty tests whose output explains nothing.
      - name: bats must be new enough
        run: |
          bats --version
          need="$(sed -n 's/^bats_require_minimum_version \([0-9.]*\).*/\1/p' \
                  tests/helper.bash | head -n1)"
          test -n "$need" || { echo "helper.bash declares no minimum bats version" >&2; exit 1; }
          have="$(bats --version | awk '{print $2}')"
          lowest="$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)"
          if [ "$lowest" != "$need" ]; then
            echo "bats ${have} is older than the ${need} tests/helper.bash requires" >&2
            exit 1
          fi

      - name: make test
        run: make test

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: --help, --version, --list-steps
        run: |
          ./gentoo-install.sh --help
          ./gentoo-install.sh --version
          ./gentoo-install.sh --list-steps

      - name: Nothing but --json writes on stdout
        run: |
          out="$(./gentoo-install.sh --dry-run --non-interactive 2>/dev/null)"
          test -z "$out" || { echo "unexpected stdout: $out" >&2; exit 1; }

      - name: --json is valid JSON
        run: ./gentoo-install.sh --json | python3 -m json.tool > /dev/null

      - name: An unknown option exits 2
        run: |
          set +e
          ./gentoo-install.sh --no-such-flag
          rc=$?
          set -e
          test "$rc" -eq 2 || { echo "expected exit 2, got ${rc}" >&2; exit 1; }
